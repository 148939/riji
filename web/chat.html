<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>聊天室 · 大肥鱼和小肥鱼</title>
<style>
:root{color-scheme:light;--bg:#f7f2e8;--card:#fffdf8;--ink:#2a2622;--muted:#8a8175;--line:#e6dccb}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,"Segoe UI",sans-serif}
header{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
h1{font-size:15px;font-weight:500;margin:0}
a.back{background:var(--ink);color:var(--bg);border:1px solid var(--ink);padding:6px 12px;border-radius:8px;text-decoration:none;font-size:13px}
#list{max-width:820px;margin:16px auto;padding:0 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:76%;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
.msg.me{align-self:flex-end;background:#e9f2e6;border-color:#cfe0c9}
.meta{font-size:11px;color:var(--muted);margin-bottom:2px}
.text{white-space:pre-wrap;word-break:break-word}
#compose{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px;display:flex;gap:8px;max-width:820px;margin:0 auto}
#input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:8px 10px;font:inherit;resize:none;height:38px}
#send{background:var(--ink);color:var(--bg);border:0;border-radius:8px;padding:0 16px;cursor:pointer}

</style></head>
<body>
<header>
  <a class="back" href="/">← 日记</a>
  <h1 style="color:var(--ink)">聊天室</h1>
</header>

<div id="list"></div>
<div id="compose"><textarea id="input" placeholder="说点什么…（Enter 发送）"></textarea><button id="send">发送</button></div>
<script>
var ch="sisters";
var list=document.getElementById("list"),input=document.getElementById("input");
var lastCount=-1;
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function load(){fetch("/api/chat?channel="+encodeURIComponent(ch)).then(function(r){return r.json();}).then(function(d){var m=d.messages||[];if(m.length===lastCount)return;lastCount=m.length;list.innerHTML="";m.forEach(function(x){var d1=document.createElement("div");d1.className="msg"+(x.from==="主人"?" me":"");d1.innerHTML='<div class="meta">'+esc(x.from)+" · "+esc(x.at)+'</div><div class="text">'+esc(x.text)+"</div>";list.appendChild(d1);});window.scrollTo(0,document.body.scrollHeight);}).catch(function(){});}
function send(){var t=input.value.trim();if(!t)return;input.value="";fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({channel:ch,text:t,from:"主人"})}).then(function(){lastCount=-1;load();});}
document.getElementById("send").onclick=send;
input.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
load();setInterval(load,3000);
</script></body></html>
