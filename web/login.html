<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>日迹 · 登录</title>
<style>
  :root{--paper:#f6f2ea;--card:#fffdf9;--ink:#2b2620;--ink2:#5a5248;--muted:#a79d8e;
    --line:#e7dfd0;--accent:#b4552f;--accent2:#8a3f20;
    --serif:"Source Han Serif SC","Songti SC","STSong",Georgia,serif;
    --sans:"PingFang SC","Microsoft YaHei","Noto Sans SC",-apple-system,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--paper);color:var(--ink);
    font-family:var(--sans);display:flex;align-items:center;justify-content:center;padding:24px}
  .box{width:min(360px,100%)}
  h1{font-family:var(--serif);font-size:34px;letter-spacing:.16em;margin:0 0 6px;text-indent:.16em}
  .tag{font-size:12.5px;color:var(--muted);letter-spacing:.22em;margin:0 0 30px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
  input{width:100%;border:1px solid var(--line);background:#fffdf8;border-radius:10px;
    padding:12px 14px;font-size:14px;color:var(--ink);outline:none;margin-bottom:16px;font-family:var(--sans)}
  input:focus{border-color:var(--accent)}
  button{width:100%;border:0;border-radius:10px;padding:13px;font-size:14.5px;letter-spacing:.08em;
    background:var(--ink);color:var(--paper);cursor:pointer;font-family:var(--sans)}
  button:disabled{opacity:.6;cursor:default}
  .swap{margin:16px 0 0;font-size:12.5px;color:var(--muted);text-align:center}
  .swap a{color:var(--accent);cursor:pointer;text-decoration:none}
  .err{color:#b4552f;font-size:12.5px;margin:0 0 12px;min-height:18px}
</style>
</head>
<body>
<div class="box">
  <h1>日迹</h1>
  <p class="tag">一日一迹 · 与自己相遇</p>
  <div class="card">
    <p class="err" id="err"></p>
    <label>邮箱</label>
    <input id="email" type="email" autocomplete="username" placeholder="you@example.com">
    <label>密码</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="至少 6 位">
    <div id="codeRow" hidden>
      <label>邮箱验证码</label>
      <div style="display:flex;gap:8px">
        <input id="code" inputmode="numeric" placeholder="6 位数字" style="margin-bottom:16px">
        <button id="sendCode" type="button" style="width:120px;flex:none;margin-bottom:16px">发验证码</button>
      </div>
    </div>
    <button id="go">登录</button>
    <p class="swap" id="rowSwap"><span id="hint">还没有账号？</span> <a id="swap">注册一个</a></p>
    <p class="swap"><a id="forgot">忘记密码</a></p>
  </div>
</div>
<script>
let mode = 'login';
let resetToken = '';
let codeId = '';
const $ = function(id){ return document.getElementById(id); };

(function fromHash(){
  const m = (location.hash || '').match(/reset=([\w-]+)/);
  if (m){
    resetToken = m[1];
    mode = 'reset';
    document.querySelector('.card').innerHTML =
      '<p class="err" id="err"></p>' +
      '<label>新密码</label>' +
      '<input id="password" type="password" placeholder="至少 6 位">' +
      '<button id="go2">重设密码</button>';
    document.getElementById('go2').addEventListener('click', doReset);
    document.getElementById('password').focus();
  }
})();

async function doReset(){
  const pw = document.getElementById('password').value;
  if (pw.length < 6){ document.getElementById('err').textContent = '至少 6 位'; return; }
  const r = await fetch('/api/reset', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ token: resetToken, password: pw })
  });
  const j = await r.json();
  if (j.ok){ location.href = '/'; return; }
  document.getElementById('err').textContent = j.error || '重置失败';
}

$('forgot').addEventListener('click', async function(){
  const email = $('email').value.trim();
  if (!email){ $('err').textContent = '先填邮箱'; return; }
  const r = await fetch('/api/forgot', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ email: email })
  });
  const j = await r.json();
  $('err').textContent = j.smtp
    ? '如果这个邮箱注册过，重置链接已经发出。'
    : '服务器没配置发信，请联系管理员帮你重置。';
});
function setMode(m){
  mode = m;
  $('codeRow').hidden = (m !== 'register');
  if (m !== 'register') $('sendCode').textContent = '发验证码';
  $('go').textContent = (m === 'login') ? '登录' : '注册';
  $('hint').textContent = (m === 'login') ? '还没有账号？' : '已经有账号？';
  $('swap').textContent = (m === 'login') ? '注册一个' : '去登录';
  $('err').textContent = '';
}
$('swap').addEventListener('click', function(){ setMode(mode === 'login' ? 'register' : 'login'); });

$('sendCode').addEventListener('click', async function(){
  const email = $('email').value.trim();
  if (!email){ $('err').textContent = '先填邮箱'; return; }
  this.disabled = true;
  try {
    const r = await fetch('/api/send_code', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ email: email })
    });
    const j = await r.json();
    codeId = j.code_id || '';
    $('err').textContent = j.ok ? '验证码已发到 ' + email : (j.error || '发不出去');
    if (j.ok){
      let n = 60;
      const btn = this;
      const t = setInterval(function(){
        n -= 1;
        btn.textContent = n + ' 秒';
        if (n <= 0){ clearInterval(t); btn.textContent = '发验证码'; btn.disabled = false; }
      }, 1000);
      return;
    }
  } catch (e) { $('err').textContent = '连不上服务器'; }
  this.disabled = false;
});
$('password').addEventListener('keydown', function(e){ if (e.key === 'Enter') submit(); });
$('go').addEventListener('click', submit);
async function submit(){
  const email = $('email').value.trim();
  const password = $('password').value;
  if (!email || !password){ $('err').textContent = '邮箱和密码都要填'; return; }
  $('go').disabled = true;
  try{
    const r = await fetch(mode === 'login' ? '/api/login' : '/api/register', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: email, password: password,
                          code: ($('code') || {}).value || '', code_id: codeId})
    });
    const j = await r.json();
    if (j.ok){ location.href = '/'; return; }
    $('err').textContent = j.error || '出了点问题';
  }catch(e){ $('err').textContent = '连不上服务器'; }
  $('go').disabled = false;
}
setMode('login');
$('email').focus();
</script>
</body>
</html>
