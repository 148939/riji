<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>收藏室</title>
<style>
:root{color-scheme:light;--bg:#f7f2e8;--card:#fffdf8;--ink:#2a2622;--muted:#8a8175;--line:#e6dccb}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 system-ui,"Segoe UI",sans-serif}
header{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2}
h1{font-size:15px;font-weight:500;margin:0}
a.back{background:var(--ink);color:var(--bg);border:1px solid var(--ink);padding:6px 12px;border-radius:8px;text-decoration:none;font-size:13px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:16px;max-width:1100px;margin:0 auto}
figure{margin:0;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
img{width:100%;height:220px;object-fit:cover;display:block;background:#fff}
figcaption{padding:8px 10px;font-size:12px;color:var(--muted);line-height:1.5}
figcaption b{color:var(--ink);font-weight:500}
.empty{color:var(--muted);padding:24px 16px}
</style></head>
<body>
<header><a class="back" href="/">← 日记</a><h1>收藏室</h1></header>
<main id="g"></main>
<script>
fetch("/api/collections").then(function(r){return r.json();}).then(function(d){
  var g=document.getElementById("g"), items=d.items||[];
  if(!items.length){ g.innerHTML='<p class="empty">还没有收藏。</p>'; return; }
  items.forEach(function(f){ (f.images||[]).forEach(function(img){
    var fig=document.createElement("figure");
    fig.innerHTML='<img loading="lazy" src="'+img.url+'"><figcaption><b>'+String(f.title||"")+'</b><br>'+String(img.message||"")+'<br><span style="color:#aaa">♥ '+String(img.like||0)+' · '+String(img.uname||"")+'</span></figcaption>';
    g.appendChild(fig);
  });});
});</script>
</body></html>
